appId: dev.wins.jaz
productName: Jaz
directories:
  output: dist
files:
  - out/**
asarUnpack:
  - node_modules/@trycua/**
  - node_modules/@ubjs/**
extraResources:
  - from: resources/bin
    to: bin
mac:
  icon: src/assets/jaz.icon
  target:
    - target: dmg
      arch:
        - arm64
    - target: zip
      arch:
        - arm64
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    NSScreenCaptureUsageDescription: Jaz uses screen capture to let your agents see and control desktop apps.
    NSMicrophoneUsageDescription: Jaz uses the microphone for voice input.
win:
  icon: src/assets/jaz.ico
  target:
    - target: nsis
      arch:
        - x64
    - target: zip
      arch:
        - x64
nsis:
  artifactName: ${productName}-Setup-${version}.${ext}
dmg:
  background: build/dmg-background.png
  iconSize: 128
  contents:
    - x: 150
      y: 150
      type: file
    - x: 390
      y: 150
      type: link
      path: /Applications
publish:
  provider: github
  owner: gluonfield
  repo: jaz
  releaseType: release
npmRebuild: false
